# Recommended for Z-Image (base): TP2 x CFG2 on one Trn2 chip (4 logical cores). Each guidance branch runs
# on its own TP2 group at the same time. Alternatives: z_image_stage_tp4_cfg2.yaml (8 cores, fastest),
# z_image_stage_tp4.yaml (4 cores, recommended for Z-Image-Turbo), z_image_stage_tp8.yaml (8 cores, fastest
# Z-Image-Turbo), z_image_stage_tp2.yaml (2 cores).
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0,1,2,3"          # TP2 x CFG2: four logical cores (indices into the visible core list)
      max_batch_size: 1
    engine_args:
      model_class_name: ZImagePipeline
      model_stage: diffusion
      dtype: bfloat16
      engine_backend: vllm_omni_neuron.diffusion.models.z_image.pipeline_z_image.ZImageDiffusionEngine
      model_config:
        block_split: 5          # main-block graph size for BlockGraphRunner (30 layers / 5 = 6 chunks)
        text_encoder_on_host: false # on the NeuronCores (TP), fp32 residual + norms; true = CPU bf16
        vae_tile_lat: 64        # host-tiled VAE decode, tile size in latent px (0 = whole-latent graph)
        dummy_run_height: 1024  # match served res -- see ZImageDiffusionEngine docstring
        dummy_run_width: 1024
      parallel_config:
        tensor_parallel_size: 2 # shard the DiT across 2 cores per guidance branch
        cfg_parallel_size: 2    # one guidance branch per TP group, at once (Z-Image base; Turbo has no CFG)
