# Qwen-Image 2.1 text-to-image on Neuron (vLLM-Omni), 8 NeuronCores: an adjacent pair of Trainium2
# chips at LNC=2, tensor-parallel 8 for the Qwen3-VL text encoder and the DiT. The VAE decode deals
# its 256px tiles across all 8 ranks. Warm 1024x1024 / 40 steps: 10.5 s.
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0,1,2,3,4,5,6,7"
      max_batch_size: 1
    engine_args:
      model_class_name: QwenImage21Pipeline
      model_stage: diffusion
      dtype: bfloat16
      parallel_config:
        tensor_parallel_size: 8
