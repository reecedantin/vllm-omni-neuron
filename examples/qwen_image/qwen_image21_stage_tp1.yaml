# Qwen-Image 2.1 on a single logical NeuronCore (TP=1). Fits only small checkpoints (the 7B DiT
# plus the 8B text encoder need ~31 GB in bf16, more than one LNC=2 core holds); used for the
# random-weight tiny checkpoint and for bring-up.
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_class_name: QwenImage21Pipeline
      model_stage: diffusion
      dtype: bfloat16
      parallel_config:
        tensor_parallel_size: 1
