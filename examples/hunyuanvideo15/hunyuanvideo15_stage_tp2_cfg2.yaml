# HunyuanVideo-1.5 T2V on Neuron, one Trn2 chip (4 logical cores): TP=2 x CFG-parallel 2
# (each guidance branch on its own core pair; the noise predictions are exchanged on the device per step).
# The DiT is compiled per geometry on first use; later runs hit the NEFF cache. The Qwen2.5-VL / byT5
# text encoders: Qwen2.5-VL tower on the NeuronCores (TP=4), byT5 on the host; the VAE decode is tiled across all ranks (HV15_VAE_HOST=1: host).
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: video
    runtime:
      process: true
      devices: "0,1,2,3"
      max_batch_size: 1
    engine_args:
      model_class_name: HunyuanVideo15Pipeline
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        vae_dtype: bfloat16
      parallel_config:
        tensor_parallel_size: 2
        cfg_parallel_size: 2
