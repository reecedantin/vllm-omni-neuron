# HunyuanVideo-1.5 I2V on Neuron, two Trn2 chips (8 logical cores): TP=8, one forward per step.
# For the CFG-distilled checkpoints (guidance 1.0 from the checkpoint's guider config). 720p_i2v_distilled_sparse
# runs its SSTA sparse attention (block-sparse kernel; HV15_ATTN_MODE=dense_tiles for the dense baseline), which
# needs HV15_BLOCKS_PER_GRAPH > 0. The CFG checkpoints (720p_i2v, guidance 6) run both branches sequentially here.
# The DiT is compiled per geometry on first use; later runs hit the NEFF cache. SigLIP, the VAE encoder (first-frame
# condition) and byT5 run on the host of global rank 0; the Qwen2.5-VL tower on the NeuronCores (TP=4 per chip);
# the VAE decode tiles are dealt across all 8 ranks.
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: video
    runtime:
      process: true
      devices: "0,1,2,3,4,5,6,7"
      max_batch_size: 1
    engine_args:
      model_class_name: HunyuanVideo15ImageToVideoPipeline
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        vae_dtype: bfloat16
      parallel_config:
        tensor_parallel_size: 8
