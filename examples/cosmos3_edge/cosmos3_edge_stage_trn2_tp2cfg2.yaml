# Cosmos3-Edge generator on Trn2: one Trainium2 chip (4 logical NeuronCores at LNC=2),
# TP=2 x CFG-parallel 2 (16 query heads / 8 K/V heads -> 8 / 4 per core). The conditional and
# unconditional passes of each step run on separate TP=2 groups; the VAE decode is patch-parallel
# over all 4 ranks. Also export COSMOS3_EDGE_VAE_TILE=256,256,240,208 (full-size 256 px decode
# tiles, the same compiled tile graph at every resolution).
# `devices`: comma-separated logical NeuronCore ids (indices into NEURON_VISIBLE_DEVICES when set).
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0,1,2,3"
      max_batch_size: 1
    engine_args:
      model_class_name: Cosmos3OmniPipeline
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        compile_vae_encoder: true
        guardrails: false
      parallel_config:
        tensor_parallel_size: 2
        cfg_parallel_size: 2
        vae_patch_parallel_size: 4
