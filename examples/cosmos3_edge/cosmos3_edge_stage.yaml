# Cosmos3-Edge generator on Neuron (vLLM-Omni). Default layout: one NeuronCore, TP=1
# (inf2.8xlarge has two; trn2 has 64 at LNC=2). The text (UND) and diffusion (GEN) towers and
# the Wan2.2-5B VAE are compiled per geometry on first use; later runs hit the NEFF cache.
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_class_name: Cosmos3OmniPipeline
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        # compile the VAE encoder too (needed by I2V / action conditioning)
        compile_vae_encoder: true
        # NVIDIA's Cosmos guardrails need the separate `cosmos-guardrail` package (and its
        # models); off by default here, equivalent to `vllm serve ... --no-guardrails`.
        guardrails: false
      parallel_config:
        tensor_parallel_size: 1
