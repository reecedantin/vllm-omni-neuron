# GR00T N1.7 policy on AWS Trainium2 (trn2) via vLLM Omni Neuron. One NeuronCore, TP=1: the
# 3B model is ~5.9 GB in bf16, well under one trn2 logical core's ~24 GB (LNC=2). Three graphs
# (VLM vision tower, VLM text decoder, flow-matching action head with the 4 Euler denoising
# steps unrolled) compile on first use; later runs hit the NEFF cache. Also runs unchanged on
# Inferentia2 / Trainium1 (NeuronCore-v2): swap `devices:` for a core on that host.
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: actions
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_class_name: Gr00tN1d7Pipeline
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        embodiment_tag: OXE_DROID_RELATIVE_EEF_RELATIVE_JOINT
        # local Qwen3-VL-2B-Instruct processor directory (tokenizer + image processor);
        # leave unset to use $GR00T_VLM_PROCESSOR, or the Hub id when online
        # vlm_processor: /path/to/Qwen3-VL-2B-Instruct
      parallel_config:
        tensor_parallel_size: 1
